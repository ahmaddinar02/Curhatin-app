name: curhatin
description: "Aplikasi kesehatan mental dan ruang aman untuk bercerita."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Blok flutter harus berada di paling luar (sejajar dengan dependencies/dev_dependencies)
flutter:
  uses-material-design: true

  assets:
    - assets/image/logo_hero.png
    - assets/image/bordir_bawah.png
    - assets/image/logo_hero1.png
    - assets/image/bordir_bawah1.png